<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AstroHealth | Mission Control</title>
    <script>
      (function () {
        var key = "astrohealth-theme-mode";
        var saved = null;
        try { saved = window.localStorage.getItem(key); } catch (_) {}
        var mode = saved === "light" || saved === "dark" || saved === "system" ? saved : "system";
        var resolved = mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : mode === "system" ? "light" : mode;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      }());
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
